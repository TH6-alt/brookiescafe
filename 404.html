<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · Brookies Café</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F7F0E6">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/styles.css">
<style>
  .e404 {
    min-height: 100vh; min-height: 100svh;
    display: grid; place-items: center; text-align: center;
    padding: var(--space-8) var(--gutter);
  }
  .e404__inner { max-width: 46ch; display: flex; flex-direction: column; align-items: center; gap: var(--space-4); }
  .e404 img { width: 88px; height: 88px; }
  .e404 h1 { font-size: var(--fs-h1); }
  .e404 p { color: var(--cor-texto-suave); }
  .e404 .btn-row { display: flex; flex-wrap: wrap; gap: var(--space-3); justify-content: center; margin-top: var(--space-2); }
</style>
</head>
<body>
<main class="e404">
  <div class="e404__inner">
    <img src="/assets/img/logo.svg" alt="Brookies Café" width="88" height="88">
    <p class="eyebrow">Erro 404</p>
    <h1>Essa página saiu pra tomar um café</h1>
    <p>O link que você abriu não existe ou mudou de lugar. Volte pro início ou dê uma olhada no que rola no nosso Instagram.</p>
    <div class="btn-row">
      <a class="btn btn--primary" href="/">Voltar ao início</a>
      <a class="btn btn--ghost" href="https://www.instagram.com/brookiescafes/" target="_blank" rel="noopener">Ver no Instagram</a>
    </div>
  </div>
</main>
</body>
</html>
